name: Security

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Mondays

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz
      - name: Run gitleaks
        run: ./gitleaks detect --source=. --log-opts="--all" --verbose

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.x"
      - run: pip install semgrep
      - run: semgrep scan --config=auto --sarif --output=semgrep.sarif
      - uses: github/codeql-action/upload-sarif@eda5730a8bfb740e03a28087a958444c646e5842  # v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: [secrets, sast]
    if: failure()
    steps:
      - name: Send Discord alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"Security scan failed in **${{ github.repository }}**\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
